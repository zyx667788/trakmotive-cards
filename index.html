     * - include "dbc/common/web_component_event_handlers.html"
     * 
     * Then in your script:
     * const helpers = initWebComponentHelpers(cardElement);
     * helpers.attachAllEventListeners(EVENTS);
     */
    
    // ========================================================================
    // CONSTANTS
    // ========================================================================
    const DBC_SIGNUP_BASE_URL = 'https://www.uniqode.com/store/starter-signup';
    const DBC_SIGNUP_BASE_PARAMS = 'trial_source=dbc_leads_post_scan&product_selected=DBC';
    const DBC_EVENT_TRACKING_PATH = 'eddy.pro/dbc/et/';
    
    // ========================================================================
    // UTILITY FUNCTIONS (OUTER SCOPE)
    // Moved to outer scope for better performance and SonarQube compliance
    // These don't depend on cardElement closure
    // ========================================================================
    
    /**
     * Open Create Card signup page with tracking params
     * 
     * @param {string} event - Amplitude event name
     * @param {string} eventProperty - Amplitude event property
     * @param {Object} customParams - Additional URL parameters
     */
    function createCard(event, eventProperty, customParams) {
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, event, eventProperty);
        let url = `${DBC_SIGNUP_BASE_URL}?${DBC_SIGNUP_BASE_PARAMS}`;
        
        if (typeof customParams === 'object') {
            const customParamsString = Object.entries(customParams)
                .map(([key, value]) => `${key}=${encodeURIComponent(value)}`)
                .join('&');
            url += '&' + customParamsString;
        }
        
        globalThis.open(url, '_blank');
    }
    
    /**
     * Handle Footer CTA click
     * 
     * @param {CustomEvent} e - Footer CTA event with e.detail.slug
     */
    function handleFooterCtaClick(e) {
        const slug = e?.detail?.slug;
        const url = `${DBC_SIGNUP_BASE_URL}?${DBC_SIGNUP_BASE_PARAMS}&utm_source=footer_branding_cta&utm_medium=CreateYourFreeCard&card_source=${slug}`;
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'create_your_free_card_clicked', 'post_scan_click');
        globalThis.open(url, '_blank');
    }
    
    /**
     * Handle success drawer open event
     * 
     * @param {CustomEvent} e - Success drawer open event
     */
    function handleSuccessDrawerOpen(e) {
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'success_drawer_open', e?.detail?.actionType);
    }
    
    /**
     * Handle success drawer close event
     */
    function handleSuccessDrawerClose() {
        // Drawer closed
    }
    
    /**
     * Decoupled post-scan app-redirect drawer opened
     *
     * @param {CustomEvent} e - carries e.detail.source
     */
    function handleAppRedirectDrawerOpen(e) {
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'post_scan_app_drawer_opened', e?.detail?.source || 'after_lead_submit');
    }

    /**
     * Decoupled post-scan app-redirect drawer closed
     */
    function handleAppRedirectDrawerClose() {
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'post_scan_app_drawer_closed');
    }

    /**
     * "Get the app" / "Create Your Card" clicked in the app-redirect drawer.
     * The library opens the app link itself; this only logs.
     *
     * @param {CustomEvent} e - carries e.detail.source
     */
    function handleAppRedirectCtaClick(e) {
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'download_app_cta_clicked', e?.detail?.source || 'after-decoupled-save-contact');
    }

    /**
     * Handle Create Card button click in success drawer
     * 
     * @param {CustomEvent} e - Create card click event
     */
    function handleCreateCardClick(e) {
        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'create_dbc_cta_clicked', 'after-exchange-contacts');
        // The library opens the signup URL automatically
    }
    
    /**
     * Initialize Web Component event handlers for a card element
     * @param {HTMLElement} cardElement - The Web Component card element
     * @returns {Object} Event handler functions bound to the card element
     */
    function initWebComponentHelpers(cardElement) {
        
        // ========================================================================
        // LEAD FORM SUBMISSION
        // ========================================================================
        // Note: Uses global getCookie() from new_dbc_base_layout.html
        // ========================================================================
        
        /**
         * Handle lead form submission
         * Makes API call to save lead, shows animation, and success drawer
         * 
         * @param {CustomEvent} e - Lead form submit event with e.detail containing form data
         */
        async function handleLeadFormSubmit(e) {
            // Form data is directly in e.detail (not e.detail.data)
            const formData = e.detail;
            
            // Get card data from the component to build the lead object
            const cardData = cardElement.cardData || {};
            
            // Build lead object matching existing layout format (lead_collect_form.html)
            const lead = {
                first_name: formData?.first_name || '',
                last_name: formData?.last_name || '',
                email: formData?.email || '',
                creation_source: 1,  // Required: indicates lead source
                token: cardData?.leads_security_token || '',  // Required: security token
                dbc: cardData?.product_id || '',  // Required: product ID
                marketing_consent: formData?.marketing_consent || false
            };
            
            // Add optional fields if provided
            if (formData?.phone_number) {
                lead.phone = formData.phone_number;
            }
            if (formData?.designation) {
                lead.designation = formData.designation;
            }
            if (formData?.notes) {
                lead.notes = formData.notes;
            }
            if (formData?.company_name) {
                lead.company = formData.company_name;
            }
            
            try {
                // Make API call to save lead
                const requestUrl = cardData.api_base_url + '/eddy.pro/lead/';
                
                const response = await fetch(requestUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(lead)
                });
                
                if (response.ok) {
                    await response.json();
                    // Log to amplitude
                    if (typeof logEventToAmplitude === 'function') {
                        logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'lead_collected');
                    }
                    
                    // Close lead form with success state
                    cardElement.showLeadFormSuccess();
                    
                    // Show card exchange animation (3 seconds)
                    cardElement.showCardExchangeAnimation({
                        first_name: formData?.first_name || '',
                        last_name: formData?.last_name || '',
                        email: formData?.email || '',
                        company_name: formData?.company_name || ''
                    }, 3000);
                    
                    
                } else {
                    let errorMessage = 'Failed to save lead';
                    try {
                        const error = await response.json();
                        errorMessage = error.message || errorMessage;
                    } catch (parseErr) {
                        console.error('%c[LeadForm] ❌ Error parsing response', 'color: #ef4444;', parseErr);
                    }
                    console.error('%c[LeadForm] ❌ Lead save failed', 'color: #ef4444; font-weight: bold', errorMessage);
                    cardElement.showLeadFormError(errorMessage);
                }
                
            } catch (err) {
                console.error('%c[LeadForm] ❌ Network error', 'color: #ef4444; font-weight: bold', err);
                cardElement.showLeadFormError('Network error. Please try again.');
            }
        }
        
        // ========================================================================
        // ADD TO CONTACT FLOW
        // ========================================================================
        
        /**
         * Handle Add to Contact button click
         * Web Component handles download + education drawer internally.
         * This handler is analytics-only.
         * 
         * @param {CustomEvent} e - Add to contact event with e.detail.source
         */
        function handleAddToContactClick(e) {
            // NOTE:
            // Do not trigger download/success drawer from server side.
            // The web component now owns add-to-contact flow (education drawer + download timing).
            const source = e?.detail?.source === 'lead_form'
                ? 'add_to_contacts_lead_form'
                : 'add_to_contacts_main';

            logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'add_to_contact_main_drawer_open', source);
        }
        
        // ========================================================================
        // CREATE CARD SIGNUP (Functions that need cardElement closure)
        // ========================================================================
        
        /**
         * Handle Create Now button click (in sticky footer)
         * 
         * @param {CustomEvent} e - Create now event with e.detail.slug
         */
        function handleCreateNowClick(e) {
            const slug = e?.detail?.slug;
            createCard('create_dbc_cta_clicked', 'home_button_click', {
                utm_source: 'post_exchange_cta_2',
                utm_medium: 'CreateNow',
                card_source: slug
            });
        }
        
        /**
         * Handle Connect button click
         */
        function handleConnectClick() {
            cardElement.openLeadForm();
            logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'exchange_contact_drawer_open', 'button_click');
        }
        
        // ========================================================================
        // ATTACH ALL EVENT LISTENERS
        // ========================================================================
        
        /**
         * Attach all standard event listeners to the card element
         * Call this after the card element is ready
         * 
         * @param {Object} EVENTS - Event constants from globalThis.UniqodeCardConfig.EVENTS
         */
        function attachAllEventListeners(EVENTS) {
            // Sticky Button Events
            cardElement.addEventListener(EVENTS.ADD_TO_CONTACT_CLICK, handleAddToContactClick);
            cardElement.addEventListener(EVENTS.EXCHANGE_CONTACTS_CLICK, (e) => {
                if (e?.detail?.decoupled) {
                    logEventToAmplitude(DBC_EVENT_TRACKING_PATH, 'post_scan_save_contact_cta_clicked');
                }
            });
            cardElement.addEventListener(EVENTS.CONNECT_CLICK, handleConnectClick);
            cardElement.addEventListener(EVENTS.CREATE_NOW_CLICK, handleCreateNowClick);
            cardElement.addEventListener(EVENTS.FOOTER_CTA_CLICK, handleFooterCtaClick);
            cardElement.addEventListener(EVENTS.FOOTER_LOGO_CLICK, () => {
                // Footer logo clicked
            });
            
            // Lead Form Events
            cardElement.addEventListener(EVENTS.LEAD_FORM_SUBMIT, (e) => {
                handleLeadFormSubmit(e);
            });
            
            cardElement.addEventListener(EVENTS.LEAD_FORM_CLOSE, (e) => {
                // Parity with legacy hideDrawer(), which logs this on every close path.
                if (typeof logEventToAmplitude === 'function') {
                    logEventToAmplitude(
                        DBC_EVENT_TRACKING_PATH,
                        'exchange_contact_drawer_closed',
                        e?.detail?.source || 'unknown'
                    );
                }
            });
            cardElement.addEventListener(EVENTS.LEAD_FORM_OPEN, () => {
                // Form opened
            });
            
            // Animation Events
            cardElement.addEventListener(EVENTS.ANIMATION_STARTED, (e) => {
                // Card exchange animation started
            });
            cardElement.addEventListener(EVENTS.ANIMATION_ENDED, () => {
                // Card exchange animation ended
            });
            
            // Language Events
            cardElement.addEventListener(EVENTS.LANGUAGE_CHANGE, (e) => {
                // Language change is handled internally by the library
            });
            
            // Success Drawer Events
            cardElement.addEventListener('success-drawer-open', handleSuccessDrawerOpen);
            cardElement.addEventListener('success-drawer-close', handleSuccessDrawerClose);
            cardElement.addEventListener('create-card-click', handleCreateCardClick);

            // Decoupled post-scan app-redirect drawer
            cardElement.addEventListener(EVENTS.APP_REDIRECT_DRAWER_OPEN, handleAppRedirectDrawerOpen);
            cardElement.addEventListener(EVENTS.APP_REDIRECT_DRAWER_CLOSE, handleAppRedirectDrawerClose);
            cardElement.addEventListener(EVENTS.APP_REDIRECT_CTA_CLICK, handleAppRedirectCtaClick);
            
            // Store cardElement globally
            globalThis.uniqodeCardElement = cardElement;
        }
        
        // Return public API
        return {
            handleLeadFormSubmit,
            handleAddToContactClick,
            createCard,
            handleCreateNowClick,
            handleFooterCtaClick,
            handleConnectClick,
            handleSuccessDrawerOpen,
            handleSuccessDrawerClose,
            handleCreateCardClick,
            handleAppRedirectDrawerOpen,
            handleAppRedirectDrawerClose,
            handleAppRedirectCtaClick,
            attachAllEventListeners
        };
    }
    
    // Make it globally available
    globalThis.initWebComponentHelpers = initWebComponentHelpers;
</script>



    
    <script>
        function waitForEvents(callback) {
            if (window.UniqodeCardConfig?.EVENTS) {
                callback(window.UniqodeCardConfig.EVENTS);
            } else {
                setTimeout(() => waitForEvents(callback), 50);
            }
        }
        let EVENTS = null;
        waitForEvents((events) => { EVENTS = events; });
    </script>

    <style>
        .layout-wrapper {
            width: 100%;
            max-width: 500px;
            min-width: 280px;
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        uniqode-layout-3 {
            flex: 1;
            width: 100%;
            min-height: 100vh;
        }
        @media only screen and (max-width: 500px) {
            .layout-wrapper { max-width: 100%; }
        }
    </style>

    <div class="layout-wrapper">
        <uniqode-layout-3 id="uniqode-card"></uniqode-layout-3>
    </div>

    
    <script>
        const LAYOUT_TAG = 'uniqode-layout-3';

        function hydrateCard() {
            const cardElement = document.querySelector(LAYOUT_TAG);
            const config = {
                platform: 'server',
                clicksDisabled: false,
                showConnectButtons: false,  // Dynamic: changes after lead submit
                hideFooter: false           // Dynamic: can be toggled
            };
            cardElement.cardData = card_data;
            cardElement.config = config;
        }

        window.addEventListener('DOMContentLoaded', () => {
            customElements.whenDefined(LAYOUT_TAG).then(() => {
                const cardElement = document.querySelector(LAYOUT_TAG);
                if (!cardElement) {
                    console.error('[WebComponent] Card element not found for ' + LAYOUT_TAG);
                    return;
                }

                hydrateCard();

                waitForEvents((EVENTS) => {
                    const helpers = initWebComponentHelpers(cardElement);
                    helpers.attachAllEventListeners(EVENTS);
                });
            });
        });
    </script>

    </div>

        try {
            if (typeof addGAAttribute === 'function') {
                addGAAttribute();
            }
        } catch(e) {
            console.log('Error on triggering GA event');
        }
        
    </script>
